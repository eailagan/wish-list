<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A shared Christmas wish list for the family.">
  <title>Christmas Wish List</title>
  <link rel="icon" href="./giftbook.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css?v=3">
  <script defer src="./config.js?v=3"></script>
  <script defer src="./device-store.js?v=2"></script>
  <script defer src="./app.js?v=4"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="gift" viewBox="0 0 24 24"><path d="M3 8.5h18V13H3zM5 13v8h14v-8M12 8.5V21"/><path d="M12 8.5c-1-3-2-6-4.5-6A2.5 2.5 0 0 0 5 5c0 2.5 3 3.5 7 3.5Zm0 0c1-3 2-6 4.5-6A2.5 2.5 0 0 1 19 5c0 2.5-3 3.5-7 3.5Z"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="share" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M7 10H5v10h14V10h-2"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1"/><rect x="14" y="14" width="6.5" height="6.5" rx="1"/></symbol>
    <symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.5M4 12h.5M4 18h.5"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="camera" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="link" viewBox="0 0 24 24"><path d="m10 14 4-4m-3-2 2-2a4.25 4.25 0 0 1 6 6l-2 2m-4 2-2 2a4.25 4.25 0 0 1-6-6l2-2"/></symbol>
  </svg>
  <main class="wrap">
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Christmas Wish List</h1>
      <button id="add" class="primary"><svg class="icon" aria-hidden="true"><use href="#plus"/></svg>Add gift idea</button>
    </section>
    <section class="collection" aria-labelledby="collection-title">
      <div class="collection-head">
        <div class="list-heading">
          <button class="text-btn" id="all-people" hidden>All lists</button>
          <h2 id="collection-title" tabindex="-1">Family lists</h2>
        </div>
        <div class="tools">
          <button id="share-btn" class="secondary"><svg class="icon" aria-hidden="true"><use href="#share"/></svg>Share list</button>
          <div class="views" id="view-options" role="group" aria-label="Gift view" hidden>
            <button aria-label="Card view" aria-pressed="true" id="view-grid" title="Card view"><svg class="icon" aria-hidden="true"><use href="#grid"/></svg></button>
            <button aria-label="List view" aria-pressed="false" id="view-list" title="List view"><svg class="icon" aria-hidden="true"><use href="#list"/></svg></button>
          </div>
        </div>
      </div>
      <div id="storage-note" class="storage-note" hidden><span></span><button id="sync-device" class="text-btn" hidden>Share these ideas</button></div>
      <div id="error" class="error-banner" role="alert" hidden><span></span><button class="text-btn" id="retry">Try again</button></div>
      <ul id="people" class="people" aria-labelledby="collection-title"></ul>
      <div id="ideas" class="ideas"></div>
      <div id="empty" class="empty">
        <div class="empty-icon"><svg aria-hidden="true"><use href="#gift"/></svg></div>
        <p id="empty-title">Loading lists…</p>
        <button id="empty-action" class="text-btn" hidden>Add the first idea</button>
      </div>
    </section>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="idea-form">
      <div class="dialog-head"><h2 id="editor-title">Add gift idea</h2><button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon"><use href="#close"/></svg></button></div>
      <label>Your name<input required name="person" maxlength="60" autocomplete="given-name" placeholder="e.g. Alex" list="known-people"></label>
      <datalist id="known-people"></datalist>
      <label>Gift idea<input required name="title" maxlength="120" placeholder="What would you like?"></label>
      <div class="pair"><label>Product link <small>Optional</small><input type="url" name="url" maxlength="2048" placeholder="https://" inputmode="url"></label><label>Price ($) <small>Optional</small><input type="number" name="price" step=".01" min="0" max="9999999.99" inputmode="decimal" placeholder="0.00"></label></div>
      <label>Notes <small>Optional</small><textarea name="notes" rows="2" maxlength="1000" placeholder="Size, color, or other details"></textarea></label>
      <div class="photo-line"><label class="photo-label"><input id="photo-file" type="file" accept="image/*"><svg class="icon"><use href="#camera"/></svg><span id="photo-label">Add photo</span></label><img id="photo-preview" hidden alt="Selected photo"><button type="button" id="remove-photo" class="text-btn" hidden>Remove</button></div>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="form-actions"><button id="remove" class="text-btn danger" type="button" hidden>Delete idea</button><button type="button" class="secondary" data-close>Cancel</button><button id="save" class="primary" type="submit">Save idea</button></div>
    </form>
  </dialog>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-head"><span class="detail-person" id="detail-person"></span><button class="icon-btn" data-close aria-label="Close"><svg class="icon"><use href="#close"/></svg></button></div>
    <img id="detail-image" class="detail-image" alt="" hidden><h2 id="detail-title"></h2><p id="detail-price"></p><p id="detail-notes"></p>
    <div class="detail-actions"><a id="detail-link" class="primary" target="_blank" rel="noopener noreferrer" hidden>View product</a><button class="secondary" id="edit" hidden>Edit idea</button></div>
  </dialog>
  <dialog id="share-dialog" aria-labelledby="share-title">
    <div class="dialog-head"><h2 id="share-title">Share list</h2><button class="icon-btn" data-close aria-label="Close"><svg class="icon"><use href="#close"/></svg></button></div>
    <p>Anyone with this link can view and add gift ideas.</p><label>Family link<input id="share-url" readonly></label><div class="form-actions"><button id="copy-link" class="primary">Copy link</button></div>
  </dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <div class="dialog-head"><h2 id="delete-title">Delete this idea?</h2></div><p id="delete-name"></p><div class="form-actions"><button id="delete-cancel" class="secondary">Cancel</button><button id="delete-confirm" class="primary">Delete idea</button></div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <noscript>Enable JavaScript to view and add gift ideas.</noscript>
</body>
</html>
